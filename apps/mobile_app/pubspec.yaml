name: smartbell_controller
description: "SmartBell Controller - Mobile Remote Control Application for School Radio & Bells"
publish_to: 'none'
version: 2.7.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  record: ^5.1.2
  permission_handler: ^11.3.1
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/smartbell_icon.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/smartbell_icon.png"
  min_sdk_android: 21

dependency_overrides:
  record_linux: ^1.3.1
